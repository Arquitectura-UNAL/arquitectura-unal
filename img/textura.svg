<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <defs>
    <!-- Cuadrícula técnica milimétrica arquitectónica sobre papel #F1ECD6 -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <!-- Retícula fina secundaria -->
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#E2D9BC" stroke-width="0.75" stroke-opacity="0.55"/>
      <path d="M 30 0 L 30 60 M 0 30 L 60 30" fill="none" stroke="#E8E0C8" stroke-width="0.5" stroke-opacity="0.45"/>
      <!-- Puntos de replanteo arquitectónico en intersecciones -->
      <circle cx="0" cy="0" r="1" fill="#015E97" fill-opacity="0.3"/>
      <circle cx="60" cy="0" r="1" fill="#015E97" fill-opacity="0.3"/>
      <circle cx="0" cy="60" r="1" fill="#015E97" fill-opacity="0.3"/>
      <circle cx="60" cy="60" r="1" fill="#015E97" fill-opacity="0.3"/>
      <circle cx="30" cy="30" r="0.75" fill="#F09A23" fill-opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="60" height="60" fill="transparent"/>
  <rect width="60" height="60" fill="url(#grid)"/>
</svg>