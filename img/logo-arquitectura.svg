<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Filtros de sombra suave -->
    <filter id="sombre-logo" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#132A49" flood-opacity="0.25"/>
    </filter>
    <filter id="brillo-volumen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#015E97" flood-opacity="0.3"/>
    </filter>

    <!-- Gradientes con la nueva paleta oficial -->
    <linearGradient id="grad-azul" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#015E97"/>
      <stop offset="100%" stop-color="#132A49"/>
    </linearGradient>
    <linearGradient id="grad-naranja" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F09A23"/>
      <stop offset="100%" stop-color="#E1432A"/>
    </linearGradient>
    <linearGradient id="grad-celeste" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CA3D9"/>
      <stop offset="100%" stop-color="#015E97"/>
    </linearGradient>
    <linearGradient id="grad-anillo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132A49"/>
      <stop offset="60%" stop-color="#1B385E"/>
      <stop offset="100%" stop-color="#132A49"/>
    </linearGradient>

    <!-- Rutas para texto curvo -->
    <path id="ruta-texto-superior" d="M 72 256 A 184 184 0 0 1 440 256" fill="none"/>
    <path id="ruta-texto-inferior" d="M 440 256 A 184 184 0 0 1 72 256" fill="none"/>
  </defs>

  <!-- Fondo circular exterior con textura y bisel -->
  <circle cx="256" cy="256" r="250" fill="url(#grad-anillo)" filter="url(#sombre-logo)"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#F1ECD6" stroke-width="2" stroke-opacity="0.85"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#F09A23" stroke-width="1.5" stroke-dasharray="4,6"/>

  <!-- Ticks del compás / regla de replanteo -->
  <g stroke="#F1ECD6" stroke-width="1.5" stroke-opacity="0.7">
    <line x1="256" y1="8" x2="256" y2="24"/>
    <line x1="256" y1="488" x2="256" y2="504"/>
    <line x1="8" y1="256" x2="24" y2="256"/>
    <line x1="488" y1="256" x2="504" y2="256"/>
    <line x1="81" y1="81" x2="92" y2="92"/>
    <line x1="431" y1="81" x2="420" y2="92"/>
    <line x1="81" y1="431" x2="92" y2="420"/>
    <line x1="431" y1="431" x2="420" y2="420"/>
  </g>

  <!-- Textos perimetrales del sello universitario -->
  <text font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#F1ECD6" letter-spacing="4.5">
    <textPath href="#ruta-texto-superior" startOffset="50%" text-anchor="middle">
      UNIVERSIDAD NACIONAL DE COLOMBIA
    </textPath>
  </text>
  <text font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#F09A23" letter-spacing="3.2">
    <textPath href="#ruta-texto-inferior" startOffset="50%" text-anchor="middle">
      SEDE MEDELLÍN · FACULTAD DE ARQUITECTURA
    </textPath>
  </text>

  <!-- Campo interior: Papel pergamino arquitectónico -->
  <circle cx="256" cy="256" r="162" fill="#F1ECD6" stroke="#015E97" stroke-width="3"/>
  <circle cx="256" cy="256" r="156" fill="none" stroke="#132A49" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- Cuadrícula isométrica y de replanteo técnico (Grid de plano) -->
  <g stroke="#015E97" stroke-width="0.8" stroke-opacity="0.22">
    <!-- Ejes ortogonales -->
    <line x1="120" y1="256" x2="392" y2="256"/>
    <line x1="256" y1="120" x2="256" y2="392"/>
    <!-- Diagonales isométricas a 30° -->
    <line x1="140" y1="320" x2="372" y2="190"/>
    <line x1="140" y1="190" x2="372" y2="320"/>
    <line x1="170" y1="355" x2="342" y2="155"/>
    <line x1="170" y1="155" x2="342" y2="355"/>
    <!-- Círculos de compás de modulación -->
    <circle cx="256" cy="256" r="128" fill="none" stroke="#015E97" stroke-width="0.8" stroke-dasharray="2,4" opacity="0.3"/>
    <circle cx="256" cy="256" r="85" fill="none" stroke="#E1432A" stroke-width="0.6" stroke-dasharray="3,3" opacity="0.35"/>
  </g>

  <!-- EMBLEMA CENTRAL ARQUITECTÓNICO: ICONO ESTRUCTURAL EN FORMA DE "A" ISOMÉTRICA -->
  <g id="volumen-arquitectonico" filter="url(#brillo-volumen)">
    <!-- Cubo / Podio base inferior -->
    <polygon points="256,365 316,330 316,338 256,373" fill="#132A49"/>
    <polygon points="256,365 196,330 196,338 256,373" fill="#015E97"/>

    <!-- Pilar izquierdo inclinado (Azul profundo y celeste) -->
    <polygon points="256,145 220,165 186,315 224,315" fill="url(#grad-azul)"/>
    <polygon points="186,315 224,315 204,330 166,330" fill="#132A49" opacity="0.9"/>
    <polygon points="220,165 256,145 242,205 210,222" fill="url(#grad-celeste)"/>

    <!-- Pilar derecho simétrico y voladizo estructural (Naranja dinámico) -->
    <polygon points="256,145 292,165 326,315 288,315" fill="url(#grad-naranja)"/>
    <polygon points="288,315 326,315 346,330 308,330" fill="#E1432A"/>
    <polygon points="292,165 256,145 270,205 302,222" fill="#F09A23"/>

    <!-- Viga / Puente horizontal de la "A" (Plataforma y losa volada) -->
    <!-- Cara superior del puente -->
    <polygon points="204,242 308,242 324,258 190,258" fill="#F1ECD6" stroke="#015E97" stroke-width="1.2"/>
    <!-- Cara frontal del puente -->
    <polygon points="190,258 324,258 324,272 190,272" fill="url(#grad-azul)"/>
    <!-- Placa de remate en rojo vívido -->
    <polygon points="214,246 298,246 304,254 220,254" fill="#E1432A"/>

    <!-- Cubo suspendido / Atrio central (Representa el espacio interior y la escala humana) -->
    <polygon points="256,172 276,184 276,212 256,224 236,212 236,184" fill="#F1ECD6" stroke="#132A49" stroke-width="1.5"/>
    <polygon points="256,172 276,184 256,196 236,184" fill="#4CA3D9"/>
    <polygon points="236,184 256,196 256,224 236,212" fill="#015E97"/>
    <polygon points="276,184 256,196 256,224 276,212" fill="#132A49"/>

    <!-- Líneas de cotas técnicas / Replanteo arquitectónico -->
    <line x1="160" y1="340" x2="352" y2="340" stroke="#E1432A" stroke-width="1.2"/>
    <circle cx="160" cy="340" r="2.5" fill="#E1432A"/>
    <circle cx="352" cy="340" r="2.5" fill="#E1432A"/>
    <circle cx="256" cy="340" r="2.5" fill="#015E97"/>
  </g>

  <!-- BANNER TÉCNICO INFERIOR: ARQUITECTURA -->
  <g id="cartela-titulo">
    <!-- Placa base de la cartela -->
    <rect x="126" y="372" width="260" height="42" rx="6" fill="#132A49" stroke="#F09A23" stroke-width="2"/>
    <rect x="130" y="376" width="252" height="34" rx="4" fill="#1B385E"/>

    <!-- Miras esquineras de plano ARQ -->
    <line x1="122" y1="384" x2="122" y2="402" stroke="#F1ECD6" stroke-width="1.5"/>
    <line x1="390" y1="384" x2="390" y2="402" stroke="#F1ECD6" stroke-width="1.5"/>

    <!-- Texto de carrera -->
    <text x="256" y="399" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="900" fill="#F1ECD6" text-anchor="middle" letter-spacing="4.5">
      ARQUITECTURA
    </text>
  </g>

  <!-- Cota N.P.T. y Año fundacional -->
  <text x="256" y="432" font-family="'Outfit', sans-serif" font-size="10.5" font-weight="700" fill="#132A49" text-anchor="middle" letter-spacing="2">
    ACUERDO CF-0001 · 190 CRÉDITOS
  </text>
</svg>
